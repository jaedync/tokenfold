services:
  tokenfold:
    build: .
    container_name: tokenfold
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ~/.claude/.credentials.json:/app/credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - STATS_API_KEY=${STATS_API_KEY}
      - DB_PATH=/app/data/claude_stats.db
      - TZ=${TZ:-America/Chicago}
      - STATS_OWNER=jaedyn
      # Dashboard HTTP Basic auth. An UNSET password disables auth entirely
      # (app/config.py), so these must stay here: when the deploy moved off
      # the ~/services compose on 2026-07-22 this file lacked them and
      # usage.jaedynchilton.com served the full dashboard unauthenticated.
      - DASHBOARD_USER=jaedyn
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      # Prod view defaults + enterprise geo pricing, lost in the same move.
      - TOKENFOLD_DEFAULT_SCOPE=personal
      - TOKENFOLD_ENTERPRISE_GEO=us
      # Notification relay
      - NOTIFY_TOKEN=${NOTIFY_TOKEN}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - HA_DEVICES=${HA_DEVICES}
    networks:
      - default
      - services_app_network
    ports:
      # Localhost-only: lets same-host consumers (cubestatusd's 250ms
      # agent-state poll) skip the Cloudflare round trip. Host :5000 is
      # owned by vercert, hence 5055. Never bind beyond 127.0.0.1.
      - "127.0.0.1:5055:5000"

networks:
  services_app_network:
    external: true
