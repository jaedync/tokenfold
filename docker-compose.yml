services:
  tokenfold:
    build: .
    container_name: tokenfold
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ~/.claude/.credentials.json:/app/credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - STATS_API_KEY=${STATS_API_KEY}
      # Optional read-only key for GET /api/ha (display hosts); empty disables it.
      - TOKENFOLD_READ_API_KEY=${TOKENFOLD_READ_API_KEY:-}
      - DB_PATH=/app/data/claude_stats.db
      - TZ=${TZ:-America/Chicago}
      - STATS_OWNER=jaedyn
      # Dashboard HTTP Basic auth. An UNSET password disables auth entirely
      # (app/config.py), so these must stay here: when the deploy moved off
      # the ~/services compose on 2026-07-22 this file lacked them and
      # usage.jaedynchilton.com served the full dashboard unauthenticated.
      - DASHBOARD_USER=jaedyn
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      # Prod view defaults + enterprise geo pricing, lost in the same move.
      - TOKENFOLD_DEFAULT_SCOPE=personal
      - TOKENFOLD_ENTERPRISE_GEO=us
      # Notification relay
      - NOTIFY_TOKEN=${NOTIFY_TOKEN}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - HA_DEVICES=${HA_DEVICES}
    networks:
      - default
      - services_app_network
    ports:
      # Localhost-only: lets same-host consumers (cubestatusd's 250ms
      # agent-state poll) skip the Cloudflare round trip. Host :5000 is
      # owned by vercert, hence 5055. Never bind beyond 127.0.0.1.
      - "127.0.0.1:5055:5000"

  # Opt-in (COMPOSE_PROFILES=meridian): polls a Meridian on this host every
  # two minutes so Claude quota stays current while no Pi session is running.
  # Host network only to reach Meridian, which listens on host loopback and
  # must stay there because it proxies the Claude login. Publishes no port,
  # and runs unprivileged on a read-only filesystem because it shares the
  # host's network namespace.
  quota-collector:
    build: .
    container_name: tokenfold-quota-collector
    profiles: ["meridian"]
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Lets an in-flight poll (three requests, 5 s timeout each) finish.
    stop_grace_period: 20s
    depends_on:
      - tokenfold
    command: ["python", "-m", "app.meridian_collector"]
    environment:
      - STATS_API_KEY=${STATS_API_KEY}
      - MERIDIAN_URL=${MERIDIAN_URL:-http://127.0.0.1:3456}
      - TOKENFOLD_URL=http://127.0.0.1:5055
      - COLLECTOR_MACHINE=${COLLECTOR_MACHINE:-}
      - COLLECTOR_INTERVAL_S=${COLLECTOR_INTERVAL_S:-120}

networks:
  services_app_network:
    external: true
